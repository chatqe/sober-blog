    timeout: 2s                # 命令超时
    connect-timeout: 2s        # 建立连接超时
    ssl: false
    lettuce:
      shutdown-timeout: 2s  # 应用优雅停机时给足关闭时间
      pool:
        enabled: true # 启用 lettuce.pool.* 系列参数（max-active、max-idle ...），底层会创建 GenericObjectPool 来管理连接。
        max-active: 25 # 最大连接数 同并发线程数
        max-wait: 500ms # 最大阻塞等待 负值无限制-1ms
        min-idle: 2   # 最小空闲连接 保证最少 2 条，防止频繁建链
        max-idle: 12   # 最大空闲连接
        time-between-eviction-runs: 30s  # 空闲逐出周期
        min-evictable-idle-time: 10m     # 连接最长空闲时间
      # 客户端探活（lettuce 特有）
      cluster:
        refresh:
          adaptive: true
          period: 30s

  datasource:
