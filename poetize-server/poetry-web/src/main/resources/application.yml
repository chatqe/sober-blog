server:
  port: 18081
  tomcat:
    threads.max: 50
    max-connections: 100
    max-http-form-post-size: 120MB
    connection-timeout: 60000


mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  #  configuration:
  #    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0

im:
  #  enable: true
  enable: false

user:
  code:
    #    %06d String.format()占位符 0 表示 不足6位前面补0 6表示位数 d表示十进制整数
    format: "【青肆博客】本次验证码 %s，请在5分钟内完成验证。为保证账号安全，请勿泄漏此验证码。"
  fwd:
    format: "【青肆博客】本次更新密码操作，请确保为本人操作! 校验码 %s，请在5分钟内完成验证。为保证账号安全，请勿泄漏此验证码。"
  subscribe:
    format: "【青肆博客】%s 订阅了 %s 的博客，请及时关注。"

########################定时任务配置########################
scheduling:
  enabled: false

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # 环境配置
  profiles:
    active: dev

# baidu api 配置
baidu:
  ak: "8ZzlJzkuVMNxoauwcCDYt9IMxOwebhep"  # 替换为你自己的 API Key
  url:
    ip-location: "http://api.map.baidu.com/location/ip"

