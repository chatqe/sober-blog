server:
  port: 18081
  tomcat:
    threads.max: 50
    max-connections: 100
    max-http-form-post-size: 120MB
    connection-timeout: 60000


mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  #  configuration:
  #    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0

im:
  #  enable: true
  enable: false


########################定时任务配置########################
scheduling:
  enabled: false

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # 环境配置
  profiles:
    active: dev

# baidu api 配置
baidu:
  ak: "8ZzlJzkuVMNxoauwcCDYt9IMxOwebhep"  # 替换为你自己的 API Key
  url:
    ip-location: "http://api.map.baidu.com/location/ip"

