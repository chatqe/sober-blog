spring:
  mail:
    host: smtp.qq.com
    username: ${QS_MAIL_USERNAME}
    password: ${QS_MAIL_PASSWORD}
    sender-name: "青肆博客"
    default-encoding: utf-8
    protocol: smtp
    port: 465
    properties:
      mail:
        smtp:
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
          ssl:
            enable: true

  redis:
    host: 115.190.22.240
    port: 6379
    database: 8
    password: ${QS_REDIS_PASSWORD}
    lettuce:
      pool:
        max-active: 25 # 最大连接数
        max-wait: -1ms # 最大阻塞等待 负值无限制
        min-idle: 0   # 最小空闲连接
        max-idle: 8   # 最大空闲连接



  datasource:
    username: ${QS_DB_USERNAME}
    password: ${QS_DB_PASSWORD}
    url: jdbc:mysql://115.190.22.240:3306/qingsi?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Druid 数据源专有配置
    initial-size: 5
    min-idle: 5
    max-active: 20
    max-wait: 60000
    time-between-eviction-runs-millis: 60000
    min-evictable-idle-time-millis: 300000
    validation-query: SELECT 1
    test-while-idle: true
    test-on-borrow: false
    test-on-return: false
    pool-prepared-statements: true
    max-pool-prepared-statement-per-connection-size: 20


# 是否从数据库加载环境配置
custom:
  environment:
    processor:
      enabled: false


store:
  type: qiniu

local:
  enable:
  uploadUrl:
  downloadUrl:

qiniu:
  enable: true
  accessKey: ${QS_QINIU_AK}
  secretKey: ${QS_QINIU_SK}
  bucket: pb-buckets
  downloadUrl: "https://img.soberup.top/" # 返回前端用的 CDN 域名
  pipeline: default.sys  # 私有队列可提速
  pfop-size-limit: 314572  # 压缩标准 大于300 单位 Byte，（300 kB）

# Knife4j 生产环境启用基本认证
knife4j:
  basic:
    enable: true
    username: ${KNIFE4J_USERNAME:admin}
    password: ${KNIFE4J_PASSWORD}

